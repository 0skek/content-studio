[project]
name = "local-image-server"
version = "0.1.0"
description = "Dev-only: SDXL on the local GPU, taking the same form fields as Cloudflare Workers AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.6",
    "diffusers>=0.32",
    "transformers>=4.48",
    "accelerate>=1.3",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pillow>=11",
    "python-multipart>=0.0.20",
]
