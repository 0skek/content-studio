[project]
name = "content-studio-backend"
version = "0.1.0"
description = "AI Content Studio backend: FastAPI + SQLite"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "opencv-python-headless>=4.10,<5",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Raised inside google-genai itself on Python 3.14; not actionable here.
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning:google.genai",
]
